<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/png" href="YagelClickerFavicon.png" />
  <title>Yagel Clicker</title>
  <!-- Retro Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f111a;
      --panel-bg: #181c2c;
      --panel-border: #3a4466;
      --panel-highlight: #5a6988;
      --accent-gold: #ffd541;
      --accent-gold-dark: #b86f18;
      --accent-green: #38b764;
      --accent-green-dark: #1e6f50;
      --accent-blue: #41a6f6;
      --accent-purple: #9b5de5;
      --accent-red: #e43b44;
      --text-main: #f4f4f4;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
    }

    /* Pixel Button Styling */
    .px-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #262b44;
      color: #ffffff;
      border: 3px solid #000000;
      box-shadow:
        inset 3px 3px 0px #5a6988,
        inset -3px -3px 0px #181425,
        0 4px 0 #000000;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      transition: transform 0.05s steps(2);
      text-transform: uppercase;
    }

    .px-btn:hover:not(:disabled) {
      background: #323959;
      box-shadow:
        inset 3px 3px 0px #7385ab,
        inset -3px -3px 0px #1e1930,
        0 4px 0 #000000;
    }

    .px-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow:
        inset 2px 2px 0px #181425,
        inset -2px -2px 0px #5a6988,
        0 1px 0 #000000;
    }

    .px-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.6);
    }

    .px-btn-green {
      background: #38b764;
      box-shadow:
        inset 3px 3px 0px #73ef9e,
        inset -3px -3px 0px #1e6f50,
        0 4px 0 #000000;
    }
    .px-btn-green:hover:not(:disabled) {
      background: #44cc73;
    }

    .px-btn-gold {
      background: #e89b15;
      color: #1a1000;
      box-shadow:
        inset 3px 3px 0px #ffe875,
        inset -3px -3px 0px #9e5608,
        0 4px 0 #000000;
    }
    .px-btn-gold:hover:not(:disabled) {
      background: #f5ab27;
    }

    .px-btn-purple {
      background: #7b42bc;
      box-shadow:
        inset 3px 3px 0px #b785f2,
        inset -3px -3px 0px #481d7a,
        0 4px 0 #000000;
    }

    .px-btn-blue {
      background: #2c7be5;
      box-shadow:
        inset 3px 3px 0px #7ab4ff,
        inset -3px -3px 0px #16468a,
        0 4px 0 #000000;
    }

    .px-btn-red {
      background: #d63031;
      box-shadow:
        inset 3px 3px 0px #ff7675,
        inset -3px -3px 0px #7a1414,
        0 4px 0 #000000;
    }

    /* Pixel Box Panel */
    .px-panel {
      background: var(--panel-bg);
      border: 4px solid #000000;
      box-shadow:
        inset 3px 3px 0px #3a4466,
        inset -3px -3px 0px #0d101b;
    }

    /* Animated Background Canvas */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Floating FX Canvas */
    #fxCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 25;
      pointer-events: none;
    }

    /* Screens */
    .screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .hidden {
      display: none !important;
    }

    /* HOME SCREEN */
    #homeScreen {
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      background: radial-gradient(circle at center, rgba(15, 17, 26, 0.45) 0%, rgba(10, 12, 20, 0.88) 100%);
    }

    .title-banner {
      background: #181c2c;
      border: 4px solid #000;
      box-shadow:
        inset 4px 4px 0 #5a6988,
        inset -4px -4px 0 #0d101b,
        0 8px 0 #000;
      padding: 20px 24px;
      max-width: 540px;
      width: 100%;
      margin-bottom: 18px;
    }

    .game-logo {
      font-size: clamp(22px, 5vw, 36px);
      color: var(--accent-gold);
      text-shadow:
        4px 4px 0px #000000,
        -2px -2px 0px #b86f18;
      margin: 0 0 10px 0;
      letter-spacing: 2px;
      animation: logoPulse 2s steps(4) infinite;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .subtitle-tag {
      display: inline-block;
      background: #e43b44;
      color: #fff;
      padding: 4px 10px;
      border: 2px solid #000;
      font-size: 9px;
      margin-bottom: 16px;
    }

    #homeStickerPreview {
      width: 144px;
      height: 180px;
      margin: 0 auto 16px auto;
      border: 4px solid #000;
      box-shadow: 0 6px 0 #000;
      animation: stickerFloat 1.6s steps(4) infinite;
      background: #fff;
    }

    @keyframes stickerFloat {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    .play-big-btn {
      font-size: 18px !important;
      padding: 16px 36px !important;
      margin: 8px 0;
    }

    /* MAIN GAME SCREEN */
    #gameScreen {
      justify-content: space-between;
    }

    /* Top HUD */
    .top-hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(18, 22, 36, 0.94);
      border-bottom: 4px solid #000;
      box-shadow: inset 0 -3px 0 #3a4466;
      z-index: 20;
    }

    .currency-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0d101b;
      border: 3px solid #000;
      box-shadow: inset 2px 2px 0 #262b44;
      padding: 6px 12px;
    }

    .coin-icon-canvas {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .coin-amount {
      font-size: clamp(13px, 3.2vw, 19px);
      color: var(--accent-gold);
      text-shadow: 2px 2px 0 #000;
    }

    .coin-label {
      font-size: 8px;
      color: var(--text-muted);
      display: block;
    }

    .stats-strip {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: #0d101b;
      border: 3px solid #000;
      padding: 6px 10px;
      font-size: 9px;
    }

    .stat-pill span {
      color: #41a6f6;
    }

    /* Center Stage */
    .center-stage {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }

    .active-skin-badge {
      background: rgba(13, 16, 27, 0.9);
      border: 3px solid #000;
      box-shadow: inset 2px 2px 0 #3a4466;
      padding: 6px 12px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 9px;
      z-index: 15;
    }

    .rarity-common { color: #cbd5e1; }
    .rarity-rare { color: #41a6f6; }
    .rarity-epic { color: #c084fc; }
    .rarity-legendary { color: #ffd541; }
    .rarity-mythic { color: #ff4d6d; }
    .rarity-transcendent { color: #38f2af; text-shadow: 0 0 6px rgba(56, 242, 175, 0.7); }

    /* Clickable Yagel Sticker Wrapper */
    .sticker-pedestal {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      z-index: 15;
    }

    #mainStickerCanvas {
      width: clamp(192px, 34vh, 256px);
      height: clamp(240px, 42.5vh, 320px);
      border: 5px solid #000000;
      box-shadow:
        0 10px 0 #000000,
        0 0 24px rgba(0, 0, 0, 0.75);
      background: #ffffff;
      transition: transform 0.04s steps(2);
    }

    .sticker-pedestal:hover #mainStickerCanvas {
      box-shadow:
        0 10px 0 #000000,
        0 0 24px rgba(255, 213, 65, 0.45);
    }

    .sticker-squash {
      transform: scale(0.91, 1.06) translateY(5px) !important;
    }

    /* Combo Bar */
    .combo-wrapper {
      margin-top: 14px;
      width: 240px;
      max-width: 85vw;
      background: rgba(13, 16, 27, 0.92);
      border: 3px solid #000;
      padding: 6px 8px;
      z-index: 15;
    }

    .combo-header {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      margin-bottom: 4px;
      color: #ffd541;
    }

    .combo-bar-bg {
      width: 100%;
      height: 10px;
      background: #1e2235;
      border: 2px solid #000;
    }

    .combo-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38b764, #ffd541, #e43b44);
      transition: width 0.08s steps(4);
    }

    /* Golden Glitch Yagel Event Button */
    #goldenYagelBtn {
      position: absolute;
      width: 64px;
      height: 80px;
      border: 3px solid #ffd541;
      box-shadow: 0 0 16px #ffd541, 0 4px 0 #000;
      cursor: pointer;
      z-index: 22;
      animation: goldenBounce 0.6s steps(2) infinite alternate;
      background: #fff;
      padding: 0;
    }

    @keyframes goldenBounce {
      from { transform: scale(1) rotate(-6deg); }
      to { transform: scale(1.12) rotate(6deg); }
    }

    /* Bottom Dock Navigation */
    .bottom-dock {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px 12px 14px 12px;
      background: rgba(18, 22, 36, 0.96);
      border-top: 4px solid #000;
      box-shadow: inset 0 3px 0 #3a4466;
      z-index: 20;
    }

    .dock-btn {
      flex-direction: column;
      padding: 10px 4px;
      font-size: 9px;
      text-align: center;
    }

    .dock-btn .dock-icon {
      font-size: 14px;
      margin-bottom: 2px;
    }

    /* Modal / Drawer Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 13, 0.82);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-window {
      width: 100%;
      max-width: 780px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      background: #181c2c;
      border: 4px solid #000;
      box-shadow:
        inset 4px 4px 0 #4a567d,
        inset -4px -4px 0 #0c0e17,
        0 10px 0 #000;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #10131f;
      border-bottom: 4px solid #000;
    }

    .modal-title {
      font-size: 13px;
      color: var(--accent-gold);
      margin: 0;
    }

    .modal-subbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      background: #141826;
      border-bottom: 3px solid #000;
      font-size: 9px;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Custom Pixel Scrollbar */
    .modal-body::-webkit-scrollbar {
      width: 12px;
    }
    .modal-body::-webkit-scrollbar-track {
      background: #0d101b;
      border-left: 2px solid #000;
    }
    .modal-body::-webkit-scrollbar-thumb {
      background: #4a567d;
      border: 2px solid #000;
    }

    /* Upgrade Cards */
    .upgrade-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #21263b;
      border: 3px solid #000;
      box-shadow: inset 2px 2px 0 #384163;
      padding: 10px 12px;
    }

    .upgrade-info {
      flex: 1;
      min-width: 200px;
    }

    .upgrade-name {
      font-size: 11px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .upgrade-lvl {
      display: inline-block;
      background: #0d101b;
      color: #38b764;
      border: 2px solid #000;
      padding: 2px 6px;
      font-size: 8px;
      margin-left: 6px;
    }

    .upgrade-desc {
      font-size: 8px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .upgrade-effect {
      font-size: 9px;
      color: #41a6f6;
    }

    /* Skin Grid */
    .skin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 10px;
    }

    .skin-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: #21263b;
      border: 3px solid #000;
      box-shadow: inset 2px 2px 0 #384163;
      padding: 10px 8px;
      gap: 6px;
    }

    .skin-card.equipped {
      border-color: #38b764;
      background: #1d2e2b;
      box-shadow: inset 2px 2px 0 #44cc73;
    }

    .skin-thumb {
      width: 96px;
      height: 120px;
      border: 3px solid #000;
      background: #fff;
    }

    .skin-title {
      font-size: 9px;
      color: #fff;
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Background Grid */
    .bg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
    }

    .bg-card {
      display: flex;
      flex-direction: column;
      background: #21263b;
      border: 3px solid #000;
      box-shadow: inset 2px 2px 0 #384163;
      padding: 10px;
      gap: 8px;
    }

    .bg-card.equipped {
      border-color: #ffd541;
      background: #2b271c;
    }

    .bg-preview-canvas {
      width: 100%;
      height: 90px;
      border: 3px solid #000;
      background: #000;
    }

    /* Toast Message Box (No alert() used!) */
    #toastBox {
      position: fixed;
      top: 74px;
      left: 50%;
      transform: translateX(-50%);
      background: #10131f;
      color: #ffd541;
      border: 3px solid #000;
      box-shadow: inset 2px 2px 0 #5a6988, 0 6px 0 #000;
      padding: 10px 16px;
      font-size: 10px;
      z-index: 100;
      pointer-events: none;
      text-align: center;
      max-width: 90vw;
    }

    /* Save Modal Textarea */
    .save-textarea {
      width: 100%;
      height: 90px;
      background: #0d101b;
      color: #38b764;
      border: 3px solid #000;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      resize: none;
    }

    @media (max-width: 520px) {
      .dock-btn {
        font-size: 8px;
        padding: 8px 2px;
      }
      .top-hud {
        padding: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Pixel Background Layer -->
  <canvas id="bgCanvas"></canvas>

  <!-- Floating Particles & Numbers FX Layer -->
  <canvas id="fxCanvas"></canvas>

  <!-- Custom Non-Blocking Toast Notification -->
  <div id="toastBox" class="hidden"></div>

  <!-- ==================== HOME SCREEN ==================== -->
  <section id="homeScreen" class="screen">
    <div class="title-banner">
      <div class="subtitle-tag">16-BIT MEME EDITION</div>
      <h1 class="game-logo">YAGEL CLICKER</h1>
      <canvas id="homeStickerPreview" width="64" height="80"></canvas>
      <p style="font-size: 9px; color: #cbd5e1; margin: 0 0 14px 0;">
        CLICK THE LOW-RES LEGEND. COLLECT ALL 30 EMOJI STICKERS. ASCEND TO OMNIVERSE WEALTH.
      </p>

      <div id="homeSaveSummary" class="px-panel" style="padding: 10px; margin-bottom: 14px; font-size: 9px; background: #10131f;">
        NEW SAVE READY — START YOUR STICKER EMPIRE!
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">
        <button id="playGameBtn" class="px-btn px-btn-green play-big-btn">
          ▶ PLAY GAME
        </button>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px;">
        <button id="homeSoundBtn" class="px-btn">🔊 SFX: ON</button>
        <button id="homeSaveMgrBtn" class="px-btn px-btn-blue">💾 SAVE / LOAD</button>
      </div>
    </div>
  </section>

  <!-- ==================== MAIN GAME SCREEN ==================== -->
  <section id="gameScreen" class="screen hidden">
    <!-- Top HUD -->
    <header class="top-hud">
      <div class="currency-box">
        <canvas id="hudCoinIcon" class="coin-icon-canvas" width="16" height="16"></canvas>
        <div>
          <div id="hudCoins" class="coin-amount">0</div>
          <span class="coin-label">YAGELCOINS</span>
        </div>
      </div>

      <div class="stats-strip">
        <div class="stat-pill">YPC: <span id="hudYpc">1</span></div>
        <div class="stat-pill">YPS: <span id="hudYps">0</span></div>
        <div class="stat-pill">BONUS: <span id="hudSkinBonus">+0%</span></div>
      </div>

      <div style="display: flex; gap: 6px;">
        <button id="gameSoundBtn" class="px-btn" style="padding: 8px 10px;">🔊</button>
        <button id="gameSaveBtn" class="px-btn px-btn-blue" style="padding: 8px 10px;">💾</button>
        <button id="goHomeBtn" class="px-btn px-btn-red" style="padding: 8px 10px;">HOME</button>
      </div>
    </header>

    <!-- Center Click Stage -->
    <main class="center-stage" id="centerStage">
      <div class="active-skin-badge">
        <div id="activeSkinTitle" style="color: #fff; margin-bottom: 3px;">#01 CLASSIC LIKE YAGEL</div>
        <div id="activeSkinRarity" class="rarity-common">COMMON • +0% GLOBAL</div>
      </div>

      <div id="stickerPedestal" class="sticker-pedestal" title="Click Yagel!">
        <canvas id="mainStickerCanvas" width="64" height="80"></canvas>
      </div>

      <div class="combo-wrapper">
        <div class="combo-header">
          <span>CLICK HYPE COMBO</span>
          <span id="comboMultiplierText">x1.0</span>
        </div>
        <div class="combo-bar-bg">
          <div id="comboBarFill" class="combo-bar-fill"></div>
        </div>
      </div>

      <!-- Golden Bonus Yagel Popup -->
      <button id="goldenYagelBtn" class="hidden" title="GOLDEN GLITCH YAGEL! CLICK FAST!">
        <canvas id="goldenYagelCanvas" width="64" height="80" style="width:100%;height:100%;"></canvas>
      </button>
    </main>

    <!-- Bottom Navigation Dock -->
    <nav class="bottom-dock">
      <button id="openUpgradesBtn" class="px-btn px-btn-green dock-btn">
        <span class="dock-icon">⚡</span>
        <span>UPGRADES</span>
      </button>
      <button id="openSkinShopBtn" class="px-btn px-btn-gold dock-btn">
        <span class="dock-icon">🛒</span>
        <span>SKIN SHOP</span>
      </button>
      <button id="openWardrobeBtn" class="px-btn px-btn-purple dock-btn">
        <span class="dock-icon">🎭</span>
        <span>MY SKINS</span>
      </button>
      <button id="openBgShopBtn" class="px-btn px-btn-blue dock-btn">
        <span class="dock-icon">🖼️</span>
        <span>BACKGROUNDS</span>
      </button>
    </nav>
  </section>

  <!-- ==================== MODAL DRAWER ==================== -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-window">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">SHOP</h2>
        <button id="closeModalBtn" class="px-btn px-btn-red" style="padding: 6px 10px;">✕</button>
      </div>
      <div id="modalSubbar" class="modal-subbar">
        <span id="modalBalanceText">YAGELCOINS: 0</span>
        <div id="modalExtraControls"></div>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * YAGEL CLICKER — COMPLETE RETRO PIXEL ART IDLE CLICKER ENGINE
     * ============================================================================
     * Features:
     * 1. Faithful 32x40 pixel-art rendering of the uploaded low-res Yagel portrait
     *    composited with 30 distinct custom 16x16 pixel-art corner emojis.
     * 2. Deep exponential economy engineered for months of long-term progression
     *    (reaching Decillions, Duodecillions, and beyond).
     * 3. 18 multi-tiered Upgrades (Click Power & Passive YPS Generators) with 25-level
     *    milestone doublers and buy-amount toggles (1x / 10x / 25x / MAX).
     * 4. 30 Sticker Skins Shop + Separate Wardrobe/Equip Menu + 12 Animated Pixel
     *    Backgrounds Shop.
     * 5. 8-bit Web Audio API procedural sound effects, offline idle progress,
     *    and Export/Import Base64 save strings.
     */

    // ============================================================================
    // 1. BIG NUMBER FORMATTER (Supports up to 10^100+ & Scientific Notation)
    // ============================================================================
    const NUMBER_SUFFIXES = [
      "", "K", "M", "B", "T",
      "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc",
      "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Ocd", "Nod", "Vg",
      "Uvg", "Dvg", "Tvg", "Qavg", "Qivg", "Sxvg", "Spvg", "Ocvg", "Novg", "Tg"
    ];

    function formatNumber(num) {
      if (!isFinite(num)) return "INFINITY";
      if (num < 0) return "-" + formatNumber(-num);
      if (num < 1000) {
        return num % 1 === 0 ? num.toString() : num.toFixed(1).replace(/\.0$/, "");
      }
      const tier = Math.floor(Math.log10(num) / 3);
      if (tier < NUMBER_SUFFIXES.length) {
        const scale = Math.pow(10, tier * 3);
        const scaled = num / scale;
        const decimals = scaled >= 100 ? 1 : scaled >= 10 ? 2 : 2;
        return scaled.toFixed(decimals).replace(/\.00$/, "") + " " + NUMBER_SUFFIXES[tier];
      }
      return num.toExponential(2).replace("+", "");
    }

    // ============================================================================
    // 2. RETRO 8-BIT WEB AUDIO SYNTHESIZER (Zero External Audio Files)
    // ============================================================================
    class PixelAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      playTone(freq, type, duration, vol = 0.12, slideTo = null) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
          }
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {
          // Ignore audio context autoplay errors
        }
      }

      click(combo = 1) {
        const base = 320 + Math.min(combo * 28, 380);
        this.playTone(base, "square", 0.065, 0.1, base * 1.35);
      }

      buy() {
        this.playTone(440, "square", 0.07, 0.12);
        setTimeout(() => this.playTone(660, "square", 0.09, 0.12), 65);
        setTimeout(() => this.playTone(880, "square", 0.13, 0.14), 130);
      }

      equip() {
        this.playTone(520, "triangle", 0.07, 0.14, 780);
      }

      golden() {
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        notes.forEach((n, idx) => {
          setTimeout(() => this.playTone(n, "square", 0.11, 0.13), idx * 55);
        });
      }

      error() {
        this.playTone(150, "sawtooth", 0.14, 0.11, 95);
      }
    }

    // Cache rendered sticker offscreen canvases for 60fps zero-lag rendering
    const stickerCanvasCache = {};

    function renderStickerToOffscreen(emojiKey) {
      if (isBaseYagelLoaded && stickerCanvasCache[emojiKey]) {
        return stickerCanvasCache[emojiKey];
      }

      const canvas = document.createElement("canvas");
      canvas.width = 192;
      canvas.height = 240;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      // 1. Draw the exact uploaded pixel-art Yagel portrait cleanly without filters or re-pixelation
      if (isBaseYagelLoaded && baseYagelImg.naturalWidth > 0) {

      // Matches the exact position and scale of the thumbs-up in `yagel_like.png`!

    function getSkinBonusMultiplier() {
      let totalBonus = 0;
      for (const sId of state.unlockedSkins) {
        const skin = SKINS_DATA.find(s => s.id === sId);
        if (skin) totalBonus += skin.bonus;
      }
      return 1 + totalBonus;
    }

    function getUpgradeMultiplier(level) {
      // Every 25 levels doubles the upgrade's efficiency!
      const milestones = Math.floor(level / 25);
      return Math.pow(2, milestones);
    }

    function calculateYPC() {
      let baseClick = 1;
      for (const u of UPGRADES_DATA) {
        if (u.type === "click") {
          const lvl = state.upgrades[u.id] || 0;
          if (lvl > 0) {
            baseClick += u.power * lvl * getUpgradeMultiplier(lvl);
          }
        }
      }
      const comboMult = 1 + Math.floor(comboMeter / 20) * 0.25; // up to 2.25x on fast clicks
      return baseClick * getSkinBonusMultiplier() * comboMult;
    }

    function calculateYPS() {
      let baseYps = 0;
      for (const u of UPGRADES_DATA) {
        if (u.type === "yps") {
          const lvl = state.upgrades[u.id] || 0;
          if (lvl > 0) {
            baseYps += u.power * lvl * getUpgradeMultiplier(lvl);
          }
        }
      }
      return baseYps * getSkinBonusMultiplier();
    }

    function getUpgradeBulkCost(u, currentLvl, count) {
      let total = 0;
      for (let i = 0; i < count; i++) {
        total += Math.floor(u.baseCost * Math.pow(u.growth, currentLvl + i));
      }
      return total;
    }

    function getMaxAffordableLevels(u, currentLvl, budget) {
      let count = 0;
      let totalCost = 0;
      while (count < 500) {
        const nextCost = Math.floor(u.baseCost * Math.pow(u.growth, currentLvl + count));
        if (totalCost + nextCost <= budget) {
          totalCost += nextCost;
          count++;
        } else {
          break;
        }
      }
      return { count, totalCost };
    }

    function updateAndDrawFX() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      fxCtx.imageSmoothingEnabled = false;

      // Update & Draw Coin Particles
      for (let i = coinParticles.length - 1; i >= 0; i--) {
        const p = coinParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25; // gravity
        p.life -= 0.025;
        if (p.life <= 0) {
          coinParticles.splice(i, 1);
          continue;
        }
        fxCtx.globalAlpha = Math.max(0, p.life);
        fxCtx.fillStyle = "#000000";
        fxCtx.fillRect(Math.floor(p.x) - 5, Math.floor(p.y) - 5, 10, 10);
        fxCtx.fillStyle = "#ffd541";
        fxCtx.fillRect(Math.floor(p.x) - 4, Math.floor(p.y) - 4, 8, 8);
        fxCtx.fillStyle = "#fff3b0";
        fxCtx.fillRect(Math.floor(p.x) - 3, Math.floor(p.y) - 3, 3, 3);
      }

      // Update & Draw Floating Texts
      fxCtx.font = "12px 'Press Start 2P', monospace";
      fxCtx.textAlign = "center";
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life -= 0.02;
        if (ft.life <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }
        fxCtx.globalAlpha = Math.max(0, ft.life);
        fxCtx.fillStyle = "#000000";
        fxCtx.fillText(ft.text, Math.floor(ft.x) + 2, Math.floor(ft.y) + 2);
        fxCtx.fillStyle = "#ffd541";
        fxCtx.fillText(ft.text, Math.floor(ft.x), Math.floor(ft.y));
      }

    // ============================================================================
    // 8. ANIMATED PIXEL-ART BACKGROUNDS ENGINE (12 Unique Themes)
    // ============================================================================
    const bgCanvas = document.getElementById("bgCanvas");
    const bgCtx = bgCanvas.getContext("2d");
    let bgTick = 0;

    function renderBackgroundScene(ctx, w, h, bgId, t) {
      ctx.imageSmoothingEnabled = false;

      switch (bgId) {
        case "whatsapp": {
          ctx.fillStyle = "#0b141a";
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = "#111f27";
          for (let y = 0; y < h; y += 16) {
            for (let x = 0; x < w; x += 16) {
              const offset = ((y / 16) % 2) * 8;
              ctx.fillRect((x + offset) % w, y, 4, 4);
              ctx.fillRect((x + offset + 6) % w, y + 6, 2, 2);
            }
          }
          break;
        }
        case "bliss": {
          // Windows XP Pixel Bliss
          ctx.fillStyle = "#3b82f6";
          ctx.fillRect(0, 0, w, h);
          // Pixel clouds
          ctx.fillStyle = "#ffffff";
          for (let i = 0; i < 5; i++) {
            const cx = Math.floor(((i * 90 + t * 0.25) % (w + 60)) - 30);
            const cy = 18 + (i % 3) * 18;
            ctx.fillRect(cx, cy, 28, 8);
            ctx.fillRect(cx + 4, cy - 4, 18, 4);
          }
          // Rolling green hill
          for (let x = 0; x < w; x++) {
            const hillY = Math.floor(h * 0.62 + Math.sin(x * 0.025) * 14);
            ctx.fillStyle = "#22c55e";
            ctx.fillRect(x, hillY, 1, h - hillY);
            ctx.fillStyle = "#16a34a";
            ctx.fillRect(x, hillY + 12, 1, h - hillY);
          }
          break;
        }
        case "arcade": {
          ctx.fillStyle = "#090418";
          ctx.fillRect(0, 0, w, h);
          const horizon = Math.floor(h * 0.45);
          ctx.strokeStyle = "#d946ef";
          ctx.lineWidth = 1;
          for (let i = -8; i <= 8; i++) {
            ctx.beginPath();
            ctx.moveTo(w / 2 + i * 10, horizon);
            ctx.lineTo(w / 2 + i * 48, h);
            ctx.stroke();
          }
          const scroll = (t * 0.8) % 14;
          for (let y = horizon; y < h; y += 14) {
            const py = Math.floor(y + scroll);
            ctx.fillStyle = "#06b6d4";
            ctx.fillRect(0, py, w, 1);
          }
          break;
        }
        case "matrix": {
          ctx.fillStyle = "#030d06";
          ctx.fillRect(0, 0, w, h);
          for (let x = 0; x < w; x += 6) {
            const dropY = Math.floor(((x * 13 + t * 1.8) % (h + 40)) - 20);
            ctx.fillStyle = "#15803d";
            ctx.fillRect(x, dropY - 14, 3, 14);
            ctx.fillStyle = "#4ade80";
            ctx.fillRect(x, dropY, 3, 4);
          }
          break;
        }
        case "sunset": {
          ctx.fillStyle = "#1e1035";
          ctx.fillRect(0, 0, w, h);
          const sunX = Math.floor(w / 2);
          const sunY = Math.floor(h * 0.42);
          const r = 28;
          for (let dy = -r; dy <= r; dy++) {
            if ((dy + Math.floor(t * 0.15)) % 5 === 0 && dy > 0) continue;
            const span = Math.floor(Math.sqrt(r * r - dy * dy));
            ctx.fillStyle = dy < 0 ? "#facc15" : "#f43f5e";
            ctx.fillRect(sunX - span, sunY + dy, span * 2, 1);
          }
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(0, sunY + 12, w, h);
          break;
        }
        case "lava": {
          ctx.fillStyle = "#1c0a08";
          ctx.fillRect(0, 0, w, h);
          const lavaTop = Math.floor(h * 0.72);
          ctx.fillStyle = "#dc2626";
          ctx.fillRect(0, lavaTop, w, h - lavaTop);
          ctx.fillStyle = "#f97316";
          for (let x = 0; x < w; x += 8) {
            const wave = Math.floor(Math.sin(x * 0.1 + t * 0.12) * 3);
            ctx.fillRect(x, lavaTop + wave, 8, 5);
          }
          // Rising embers
          ctx.fillStyle = "#facc15";
          for (let i = 0; i < 14; i++) {
            const ex = (i * 37 + Math.floor(t * 0.3)) % w;
            const ey = h - ((i * 23 + Math.floor(t * 0.9)) % h);
            ctx.fillRect(ex, ey, 2, 2);
          }
          break;
        }
        case "nebula": {
          ctx.fillStyle = "#060714";
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = "#311042";
          ctx.fillRect(Math.floor(w * 0.2), Math.floor(h * 0.2), Math.floor(w * 0.6), Math.floor(h * 0.5));
          for (let i = 0; i < 40; i++) {
            const sx = (i * 53) % w;
            const sy = (i * 29) % h;
            ctx.fillStyle = (i + Math.floor(t * 0.08)) % 4 === 0 ? "#ffd541" : "#ffffff";
            ctx.fillRect(sx, sy, (i % 2) + 1, (i % 2) + 1);
          }
          break;
        }
        case "vault": {
          ctx.fillStyle = "#1f1605";
          ctx.fillRect(0, 0, w, h);
          // Gold bricks bottom
          ctx.fillStyle = "#d97706";
          ctx.fillRect(0, h - 18, w, 18);
          // Falling pixel coins
          for (let i = 0; i < 18; i++) {
            const cx = (i * 41) % w;
            const cy = (i * 19 + Math.floor(t * 1.4)) % h;
            ctx.fillStyle = "#ffd541";
            ctx.fillRect(cx, cy, 4, 4);
            ctx.fillStyle = "#fef08a";
            ctx.fillRect(cx, cy, 2, 2);
          }
          break;
        }
        case "vhs": {
          ctx.fillStyle = "#141414";
          ctx.fillRect(0, 0, w, h);
          for (let y = 0; y < h; y += 3) {
            ctx.fillStyle = (y + Math.floor(t)) % 6 === 0 ? "#262626" : "#0f0f0f";
            ctx.fillRect(0, y, w, 1);
          }
          const barY = Math.floor((t * 1.5) % h);
          ctx.fillStyle = "rgba(239, 68, 68, 0.25)";
          ctx.fillRect(0, barY, w, 6);
          ctx.fillStyle = "rgba(56, 189, 248, 0.25)";
          ctx.fillRect(0, (barY + 3) % h, w, 4);
          break;
        }
        case "heaven": {
          ctx.fillStyle = "#bae6fd";
          ctx.fillRect(0, 0, w, h);
          // Sunbeams
          ctx.fillStyle = "rgba(254, 240, 138, 0.45)";
          ctx.fillRect(Math.floor(w * 0.35), 0, Math.floor(w * 0.3), h);
          // Fluffy bottom clouds
          ctx.fillStyle = "#ffffff";
          for (let x = -10; x < w + 20; x += 24) {
            const bob = Math.floor(Math.sin(x + t * 0.08) * 2);
            ctx.fillRect(x, h - 22 + bob, 26, 24);
            ctx.fillRect(x + 4, h - 26 + bob, 16, 6);
          }
          break;
        }
        case "glitch": {
          ctx.fillStyle = "#09090b";
          ctx.fillRect(0, 0, w, h);
          const colors = ["#ef4444", "#22c55e", "#3b82f6", "#facc15", "#a855f7"];
          for (let i = 0; i < 16; i++) {
            const gx = Math.floor(Math.abs(Math.sin(i * 12.3 + Math.floor(t * 0.2))) * w);
            const gy = Math.floor(Math.abs(Math.cos(i * 7.7 + Math.floor(t * 0.15))) * h);
            ctx.fillStyle = colors[i % colors.length];
            ctx.fillRect(gx, gy, 18, 4);
          }
          break;
        }
        case "omniverse": {
          ctx.fillStyle = "#05010d";
          ctx.fillRect(0, 0, w, h);
          const cx = Math.floor(w / 2);
          const cy = Math.floor(h / 2);
          const rings = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#a855f7"];
          for (let r = 5; r >= 1; r--) {
            const rad = r * 16 + Math.floor(Math.sin(t * 0.08 + r) * 4);
            ctx.strokeStyle = rings[(r + Math.floor(t * 0.05)) % rings.length];
            ctx.lineWidth = 2;
            ctx.strokeRect(cx - rad, cy - rad, rad * 2, rad * 2);
          }
          break;
        }
      }
    }

    function handleStickerClick(e) {
      e.preventDefault();
      const rect = document.getElementById("mainStickerCanvas").getBoundingClientRect();
      const cx = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : rect.left + rect.width / 2);
      const cy = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : rect.top + rect.height / 2);

      // Increase hype combo
      comboMeter = Math.min(100, comboMeter + 8);
      const gain = calculateYPC();

      state.coins += gain;
      state.totalCoinsEarned += gain;
      state.totalClicks += 1;

      // Visual squash animation
      const canvasEl = document.getElementById("mainStickerCanvas");
      canvasEl.classList.remove("sticker-squash");
      void canvasEl.offsetWidth; // trigger reflow
      canvasEl.classList.add("sticker-squash");
      setTimeout(() => canvasEl.classList.remove("sticker-squash"), 75);

      sfx.click(Math.floor(comboMeter / 10));
      spawnClickFX(cx, cy, gain);
      updateHUD();
    }

    // Golden Glitch Yagel Random Spawner
    function scheduleGoldenYagel() {
      const delay = (35 + Math.random() * 45) * 1000; // every 35-80s
      goldenTimer = setTimeout(() => {
        if (!document.getElementById("gameScreen").classList.contains("hidden") && !goldenActive) {
          spawnGoldenYagel();
        }
        scheduleGoldenYagel();
      }, delay);
    }

    function spawnGoldenYagel() {
      goldenActive = true;
      const btn = document.getElementById("goldenYagelBtn");
      const stage = document.getElementById("centerStage");
      const maxX = Math.max(20, stage.clientWidth - 90);
      const maxY = Math.max(40, stage.clientHeight - 110);
      btn.style.left = (15 + Math.random() * maxX) + "px";
      btn.style.top = (35 + Math.random() * maxY) + "px";

      // Draw random rare sticker inside golden popup
      const randomSkin = SKINS_DATA[Math.floor(Math.random() * SKINS_DATA.length)];
      drawStickerOnto(document.getElementById("goldenYagelCanvas"), randomSkin.id);
      btn.classList.remove("hidden");

      setTimeout(() => {
        btn.classList.add("hidden");
        goldenActive = false;
      }, 9000);

    function openModal(tab) {
      currentModalTab = tab;
      const overlay = document.getElementById("modalOverlay");
      const title = document.getElementById("modalTitle");
      const extra = document.getElementById("modalExtraControls");
      const body = document.getElementById("modalBody");

      overlay.classList.remove("hidden");
      extra.innerHTML = "";
      body.innerHTML = "";
      document.getElementById("modalBalanceText").textContent = `YAGELCOINS: ${formatNumber(state.coins)}`;

      if (tab === "upgrades") {
        title.textContent = "⚡ YAGEL UPGRADES SHOP";
        [1, 10, 25, "MAX"].forEach(mult => {
          const b = document.createElement("button");
          b.className = "px-btn " + (buyMultiplier === mult ? "px-btn-gold" : "");
          b.style.padding = "4px 8px";
          b.style.fontSize = "8px";
          b.textContent = mult === "MAX" ? "BUY MAX" : `x${mult}`;
          b.onclick = () => {

            openModal("upgrades");
          };
          extra.appendChild(b);
        });

      } else if (tab === "skinShop") {
        title.textContent = `🛒 STICKER SKIN SHOP (${state.unlockedSkins.length}/30)`;

        extra.innerHTML = `<span style="color:#38b764;">EQUIP ANY UNLOCKED YAGEL STICKER</span>`;

        title.textContent = `🖼️ PIXEL BACKGROUNDS (${state.unlockedBgs.length}/12)`;
        extra.innerHTML = `<span style="color:#41a6f6;">CUSTOMIZE YOUR CLICK ARENA</span>`;
        renderBackgroundShop(body);

    function closeModal() {
      currentModalTab = null;

    function renderUpgradesList(container) {
      UPGRADES_DATA.forEach(u => {
        const lvl = state.upgrades[u.id] || 0;
        let countToBuy = 1;
        let cost = 0;

        if (buyMultiplier === "MAX") {
          const res = getMaxAffordableLevels(u, lvl, state.coins);
          countToBuy = Math.max(1, res.count);
          cost = res.count > 0 ? res.totalCost : getUpgradeBulkCost(u, lvl, 1);
        } else {
          countToBuy = buyMultiplier;
          cost = getUpgradeBulkCost(u, lvl, countToBuy);
        }

        const nextMilestone = (Math.floor(lvl / 25) + 1) * 25;
        const unitGain = u.power * getUpgradeMultiplier(lvl) * getSkinBonusMultiplier();
        const canAfford = state.coins >= cost;

        const card = document.createElement("div");
        card.className = "upgrade-card";
        card.innerHTML = `
          <div class="upgrade-info">
            <div class="upgrade-name">
              ${u.name} <span class="upgrade-lvl">LVL ${lvl}</span>
            </div>
            <div class="upgrade-desc">${u.desc} (2x BONUS AT LVL ${nextMilestone})</div>
            <div class="upgrade-effect">
              +${formatNumber(unitGain)} ${u.type === "click" ? "YPC" : "YPS"} EACH
            </div>
          </div>
          <button class="px-btn ${canAfford ? "px-btn-green" : ""}" ${canAfford ? "" : "disabled"}>
            BUY +${countToBuy}<br>${formatNumber(cost)}
          </button>
        `;

        card.querySelector("button").onclick = () => {
          if (state.coins < cost) {
            sfx.error();
            return;
          }
          state.coins -= cost;
          state.upgrades[u.id] = lvl + countToBuy;
          sfx.buy();
          updateHUD();
          openModal("upgrades");
        };

        container.appendChild(card);
      });
    }

    function renderSkinShop(container) {
      const grid = document.createElement("div");
      grid.className = "skin-grid";

        const owned = state.unlockedSkins.includes(skin.id);

        const card = document.createElement("div");
        card.className = "skin-card" + (equipped ? " equipped" : "");

        const thumb = document.createElement("canvas");
        thumb.width = 64;
        thumb.height = 80;
        thumb.className = "skin-thumb";
        drawStickerOnto(thumb, skin.id);

        const titleEl = document.createElement("div");
        titleEl.className = "skin-title";
        titleEl.textContent = `#${skin.num} ${skin.name}`;

        const rarityEl = document.createElement("div");
        rarityEl.className = "rarity-" + skin.rarity.toLowerCase();
        rarityEl.style.fontSize = "8px";
        rarityEl.textContent = `${skin.rarity} (+${Math.round(skin.bonus * 100)}%)`;

        const btn = document.createElement("button");
        btn.style.width = "100%";
        btn.style.fontSize = "8px";

        if (equipped) {
          btn.className = "px-btn px-btn-green";
          btn.textContent = "✓ EQUIPPED";
          btn.disabled = true;
        } else if (owned) {
          btn.className = "px-btn px-btn-purple";
          btn.textContent = "EQUIP SKIN";
          btn.onclick = () => {
            state.equippedSkin = skin.id;
            drawStickerOnto(document.getElementById("mainStickerCanvas"), skin.id);
            sfx.equip();
            updateHUD();
            openModal("skinShop");
          };
        } else {
          btn.className = "px-btn " + (canAfford ? "px-btn-gold" : "");
          btn.disabled = !canAfford;
          btn.textContent = skin.price === 0 ? "FREE" : `${formatNumber(skin.price)}`;
          btn.onclick = () => {
            if (state.coins < skin.price) {
              sfx.error();
              return;
            }
            state.coins -= skin.price;
            state.unlockedSkins.push(skin.id);
            state.equippedSkin = skin.id;
            drawStickerOnto(document.getElementById("mainStickerCanvas"), skin.id);
            sfx.buy();
            showToast(`UNLOCKED #${skin.num} ${skin.name}!`);
            updateHUD();
            openModal("skinShop");
          };
        }

        card.appendChild(thumb);
        card.appendChild(titleEl);
        card.appendChild(rarityEl);
        card.appendChild(btn);
        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

      document.getElementById("importSaveBtn").onclick = () => {
        try {
          const val = document.getElementById("saveCodeBox").value.trim();
          const decoded = JSON.parse(atob(val));
          if (typeof decoded.coins === "number") {
            state = { ...state, ...decoded };
            saveGame(true);
            drawStickerOnto(document.getElementById("mainStickerCanvas"), state.equippedSkin);
            updateHUD();
            showToast("SAVE RESTORED SUCCESSFULLY!");
            closeModal();
          } else {

        } catch (err) {
          showToast("INVALID SAVE CODE FORMAT!");
        }
      };

    document.getElementById("homeSaveMgrBtn").addEventListener("click", () => openModal("save"));
    document.getElementById("gameSaveBtn").addEventListener("click", () => openModal("save"));

    document.getElementById("stickerPedestal").addEventListener("pointerdown", handleStickerClick);

    document.getElementById("openUpgradesBtn").addEventListener("click", () => openModal("upgrades"));
    document.getElementById("openSkinShopBtn").addEventListener("click", () => openModal("skinShop"));
    document.getElementById("openWardrobeBtn").addEventListener("click", () => openModal("wardrobe"));
    document.getElementById("openBgShopBtn").addEventListener("click", () => openModal("bgShop"));
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);

    document.getElementById("modalOverlay").addEventListener("click", (e) => {
      if (e.target.id === "modalOverlay") closeModal();
    });

    // ============================================================================
    // 12. MAIN GAME LOOP & INITIALIZATION
    // ============================================================================
    let lastFrameTime = performance.now();
    let autoSaveAccumulator = 0;

    function mainLoop(now) {
      const dt = Math.min((now - lastFrameTime) / 1000, 0.25);
      lastFrameTime = now;
      bgTick += dt * 30;

      // Passive YagelCoins Per Second (YPS) income
      const yps = calculateYPS();
      if (yps > 0) {
        const earned = yps * dt;
        state.coins += earned;
        state.totalCoinsEarned += earned;
      }

      // Decay click hype combo smoothly
      if (comboMeter > 0) {
        comboMeter = Math.max(0, comboMeter - dt * 16);
      }

      // Render animated pixel background
      renderBackgroundScene(bgCtx, bgCanvas.width, bgCanvas.height, state.equippedBg, bgTick);

      // Render particles & floating "+X" popups
      updateAndDrawFX();

      // Update HUD counters
      updateHUD();

      // Auto-save every 10 seconds
      autoSaveAccumulator += dt;
      if (autoSaveAccumulator >= 10) {
        autoSaveAccumulator = 0;
        saveGame(true);
      }

      requestAnimationFrame(mainLoop);
    }

    window.addEventListener("resize", resizeCanvases);

    window.onload = function () {
      loadGame();
      resizeCanvases();
      drawCoinIcon();
      updateHomePreview();
      drawStickerOnto(document.getElementById("mainStickerCanvas"), state.equippedSkin);

      // Sync sound button state
      document.getElementById("homeSoundBtn").textContent = state.soundEnabled ? "🔊 SFX: ON" : "🔇 SFX: OFF";
      document.getElementById("gameSoundBtn").textContent = state.soundEnabled ? "🔊" : "🔇";

      scheduleGoldenYagel();
      lastFrameTime = performance.now();
      requestAnimationFrame(mainLoop);
    };
  </script>
</body>
</html>
